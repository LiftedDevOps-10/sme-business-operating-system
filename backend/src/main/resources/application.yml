spring:
  application:
    name: sme-business-operating-system

  datasource:
    url: jdbc:postgresql://localhost:5432/smebos
    username: smebos
    password: ${SMEBOS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    org.springframework.security: DEBUG
